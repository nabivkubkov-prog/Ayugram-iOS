name: AyuGram iOS build

on:
  push:
    branches: [ 'ayugram-ios-port' ]
  pull_request:
    branches: [ 'master', 'ayugram-ios-port' ]
  workflow_dispatch:
    inputs:
      signed:
        description: 'Sign with Apple certificates and profiles supplied through repository secrets'
        type: boolean
        default: false
      checks_only:
        description: 'Run fast configuration and artifact-validator tests without compiling the app'
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test configuration and artifact validation
        run: python3 -m unittest discover -s tools/ci/tests -v
      - name: Validate current repository build credentials
        if: github.event_name != 'pull_request' && inputs.checks_only != true
        env:
          RUFATGRAM_API_ID: ${{ secrets.RUFATGRAM_API_ID }}
          RUFATGRAM_API_HASH: ${{ secrets.RUFATGRAM_API_HASH }}
          RUFATGRAM_TEAM_ID: ${{ secrets.RUFATGRAM_TEAM_ID }}
          RUFATGRAM_BUNDLE_ID: ${{ secrets.RUFATGRAM_BUNDLE_ID }}
          RUFATGRAM_URL_SCHEME: ${{ secrets.RUFATGRAM_URL_SCHEME }}
          SIGNED_BUILD: ${{ inputs.signed }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os
          spec = importlib.util.spec_from_file_location("configuration", "tools/ci/prepare-configuration.py")
          configuration = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(configuration)
          try:
              with open("build-system/rufatgram-configuration.json", encoding="utf-8") as file:
                  configuration.resolve_configuration(json.load(file), os.environ, signed=os.environ.get("SIGNED_BUILD") == "true")
          except (ValueError, OSError) as error:
              raise SystemExit("::error::" + str(error))
          print("Build credential format validated; values were not printed or written.")
          PY
      - name: Check patch whitespace
        run: git diff-tree --check HEAD

  swift-checks:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the pinned Swift toolchain
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Parse all Swift changes since the verified baseline
        run: python3 tools/ci/check-swift-syntax.py --base 471e68b5032dc299f71ed3d09e2cc34a3cb7aecf
      - name: Verify ghost policy and preference persistence
        run: |
          swiftc -warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/AyuGhostPolicy.swift \
            Swiftgram/SGSimpleSettings/Sources/AyuGhostPreferences.swift \
            Tests/AyuGramCoreTests/main.swift -o "$RUNNER_TEMP/ayu-ghost-tests"
          "$RUNNER_TEMP/ayu-ghost-tests"
      - name: Verify message filters and Unicode regular expressions
        run: |
          swiftc -warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/AyuMessageFilter.swift \
            Tests/AyuMessageFilterTests/main.swift -o "$RUNNER_TEMP/ayu-filter-tests"
          "$RUNNER_TEMP/ayu-filter-tests"
      - name: Verify message history snapshots
        run: |
          swiftc -warnings-as-errors \
            submodules/TelegramCore/Sources/State/AyuHistoryModel.swift \
            submodules/TelegramCore/Sources/State/AyuHistoryMediaBudget.swift \
            Tests/AyuHistoryTests/main.swift -o "$RUNNER_TEMP/ayu-history-tests"
          "$RUNNER_TEMP/ayu-history-tests"
      - name: Verify local appearance and per-account status persistence
        run: |
          swiftc -warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/AyuAppearanceSettings.swift \
            Tests/AyuAppearanceTests/main.swift -o "$RUNNER_TEMP/ayu-appearance-tests"
          "$RUNNER_TEMP/ayu-appearance-tests"

  build:
    needs: [checks, swift-checks]
    if: github.event_name != 'pull_request' && inputs.checks_only != true
    # Preserve the Intel host architecture of the previously verified build.
    runs-on: macos-15-intel
    timeout-minutes: 360

    env:
      CI: '1'
      # Pinned by versions.json; validated below instead of silently overriding.
      BAZEL_CACHE_DIR: ${{ github.workspace }}/../bazel-cache
      GIT_LFS_SKIP_SMUDGE: '1'

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Read toolchain versions from versions.json
        id: versions
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("versions.json") as f:
              v = json.load(f)
          print(f"xcode={v['xcode']}")
          print(f"app={v['app']}")
          print(f"bazel={v['bazel'].split(':')[0]}")
          print(f"macos={v['macos']}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Select Xcode ${{ steps.versions.outputs.xcode }}
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${{ steps.versions.outputs.xcode }}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Xcode ${{ steps.versions.outputs.xcode }} is not installed on this runner."
            echo "Available Xcode versions:"
            ls -d /Applications/Xcode*.app || true
            echo "Update versions.json and the runner image together; do not skip the version check."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcode-select -p

      - name: Verify build configuration template
        run: |
          set -euo pipefail
          CONFIG="build-system/rufatgram-configuration.json"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG is missing. It must be committed with placeholders; real values come from secrets."
            exit 1
          fi
          python3 - "$CONFIG" <<'PY'
          import json, sys
          required = ["bundle_id", "api_id", "api_hash", "team_id", "app_center_id",
                      "is_internal_build", "is_appstore_build", "appstore_id",
                      "app_specific_url_scheme", "premium_iap_product_id",
                      "enable_siri", "enable_icloud", "sg_config"]
          with open(sys.argv[1]) as f:
              cfg = json.load(f)
          missing = [k for k in required if k not in cfg]
          if missing:
              print(f"::error::Configuration is missing keys: {', '.join(missing)}")
              sys.exit(1)
          if cfg["bundle_id"] == "ph.telegra.Telegraph":
              print("::error::Refusing to build with the official Telegram.app bundle id.")
              sys.exit(1)
          if str(cfg["api_id"]) == "8":
              print("::error::The template still carries the Telegram demo api_id.")
              sys.exit(1)
          print(f"Template bundle id: {cfg['bundle_id']}, team id: {cfg['team_id']}")
          PY

      - name: Select signing mode
        id: signing
        run: |
          set -euo pipefail
          if [ "${{ inputs.signed }}" = "true" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice::This IPA requires signing with an external tool before installation on an iPhone."
          fi

      - name: Prepare build configuration
        id: configuration
        env:
          RUFATGRAM_API_ID: ${{ secrets.RUFATGRAM_API_ID }}
          RUFATGRAM_API_HASH: ${{ secrets.RUFATGRAM_API_HASH }}
          RUFATGRAM_TEAM_ID: ${{ secrets.RUFATGRAM_TEAM_ID }}
          RUFATGRAM_BUNDLE_ID: ${{ secrets.RUFATGRAM_BUNDLE_ID }}
          RUFATGRAM_URL_SCHEME: ${{ secrets.RUFATGRAM_URL_SCHEME }}
          SIGNED_BUILD: ${{ inputs.signed }}
        run: |
          set -euo pipefail
          CONFIG="build-system/rufatgram-configuration.local.json"
          # macOS ships Bash 3.2, where an empty array is unbound under set -u.
          if [ "$SIGNED_BUILD" = "true" ]; then
            python3 tools/ci/prepare-configuration.py build-system/rufatgram-configuration.json "$CONFIG" --signed
          else
            python3 tools/ci/prepare-configuration.py build-system/rufatgram-configuration.json "$CONFIG"
          fi
          test -f "$CONFIG"
          echo "path=$CONFIG" >> "$GITHUB_OUTPUT"

      - name: Install simulator runtimes for the selected Xcode
        timeout-minutes: 45
        run: |
          set -euo pipefail
          # actool/ibtool need simulator runtimes matching the SDKs of the selected
          # Xcode (Watch asset catalog, LaunchScreen.xib); runner images only ship
          # newer runtimes.
          xcrun simctl list runtimes
          # Match the actual successful build, rather than downloading whichever
          # runtime Apple marks latest on the day the workflow runs.
          python3 tools/ci/install-simulator-runtimes.py \
            --runtime iOS=18.3.1 --runtime watchOS=11.2
          xcrun simctl list runtimes
          df -h "$GITHUB_WORKSPACE"

      - name: Import signing certificate and provisioning profiles
        if: steps.signing.outputs.mode == 'signed'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROFILES_JSON_BASE64: ${{ secrets.PROFILES_JSON_BASE64 }}
        run: bash tools/ci/import-signing-assets.sh

      - name: Resolve codesigning information path
        id: codesign
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.mode }}" = "signed" ] && [ -d build-system/rufatgram-codesigning ]; then
            if ls build-system/rufatgram-codesigning/profiles/*.mobileprovision >/dev/null 2>&1; then
              echo "path=build-system/rufatgram-codesigning" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "${{ steps.signing.outputs.mode }}" = "signed" ]; then
            echo "::error::A signed CI build requires the certificate and all application extension profiles."
            exit 1
          else
            echo "path=$RUNNER_TEMP/rufatgram-fake-signing" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate temporary signing assets for external signing
        if: steps.codesign.outputs.path != 'xcode-managed' && steps.signing.outputs.mode == 'unsigned'
        run: |
          set -euo pipefail
          # The profiles committed in build-system/fake-codesigning are issued for
          # the official Telegram bundle id. Rebuild them for the configured team and
          # bundle id, otherwise Make.py rejects the signing inputs.
          python3 tools/ci/generate-fake-codesigning.py \
            --configuration "${{ steps.configuration.outputs.path }}" \
            --certificates build-system/fake-codesigning/certs \
            --output "$RUNNER_TEMP/rufatgram-fake-signing"
          # Make.py does not import certificates on its own; codesign needs the
          # placeholder identity in a keychain that is part of the search list.
          python3 build-system/Make/ImportCertificates.py \
            --path "$RUNNER_TEMP/rufatgram-fake-signing/certs"
          # rules_apple looks identities up with `security find-identity -v`, which
          # lists only trusted ones. The placeholder certificate is self-signed, so
          # trust it for code signing on this ephemeral runner only.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$RUNNER_TEMP/rufatgram-fake-signing/certs/Public.cer"
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -qE '^ *[1-9][0-9]* valid identit'; then
            echo "::error::No valid code signing identity after importing placeholder certificates."
            exit 1
          fi

      - name: Compute build number
        id: buildnum
        run: |
          set -euo pipefail
          OFFSET="$(cat build_number_offset)"
          COUNT="$(git rev-list --count HEAD)"
          echo "number=$((COUNT + OFFSET))" >> "$GITHUB_OUTPUT"

      # actions/cache only saves after a successful job, so every failed build
      # started from scratch. Restore and save separately; the save step runs
      # even when the build fails. Keys are immutable, hence the run id suffix.
      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.BAZEL_CACHE_DIR }}
            ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-

      - name: Build the app
        id: build
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ "${{ steps.codesign.outputs.path }}" = "xcode-managed" ]; then
            EXTRA_ARGS+=(--xcodeManagedCodesigning)
          else
            EXTRA_ARGS+=(--codesigningInformationPath="${{ steps.codesign.outputs.path }}")
          fi

          mkdir -p "$BAZEL_CACHE_DIR" build/artifacts build/logs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$HOME/bazel-user-root" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath="${{ steps.configuration.outputs.path }}" \
            "${EXTRA_ARGS[@]}" \
            --configuration=release_arm64 \
            --buildNumber="${{ steps.buildnum.outputs.number }}" \
            --enableParallelSwiftmoduleGeneration \
            --outputBuildArtifactsPath="$PWD/build/artifacts" 2>&1 | tee build/logs/build.log

      - name: Save Bazel cache
        if: always() && steps.build.outcome != 'skipped' && steps.bazel-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BAZEL_CACHE_DIR }}
            ~/.cache/bazel
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Verify produced IPA
        id: verify
        if: success()
        run: |
          set -euo pipefail
          IPA="build/artifacts/Swiftgram.ipa"
          if [ ! -f "$IPA" ]; then
            echo "::error::Build finished but $IPA was not produced."
            find . -maxdepth 3 -name '*.ipa' -print || true
            exit 1
          fi
          ls -lh "$IPA"
          python3 tools/ci/verify-ipa.py "$IPA" \
            --configuration "${{ steps.configuration.outputs.path }}" \
            --build-number "${{ steps.buildnum.outputs.number }}" \
            --commit "$GITHUB_SHA" \
            --signing "${{ steps.signing.outputs.mode }}" \
            --report build/artifacts/build-manifest.json
          mkdir -p build/inspect
          unzip -q "$IPA" -d build/inspect
          APP="$(find build/inspect/Payload -maxdepth 1 -name '*.app' -print -quit)"
          echo "App bundle: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          lipo -info "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"

          BUNDLE_ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["bundle_id"])' "${{ steps.configuration.outputs.path }}")"
          ACTUAL_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          if [ "$BUNDLE_ID" != "$ACTUAL_ID" ]; then
            echo "::error::Bundle id mismatch: expected $BUNDLE_ID, got $ACTUAL_ID"
            exit 1
          fi

          {
            echo "### AyuGram build"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Bundle id | \`$ACTUAL_ID\` |"
            echo "| Version | $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")) |"
            echo "| Signing | ${{ steps.signing.outputs.mode }} |"
            echo "| Xcode | $(xcodebuild -version | head -n1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify code signature (signed builds)
        if: success() && steps.signing.outputs.mode == 'signed'
        run: |
          set -euo pipefail
          APP="$(find build/inspect/Payload -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | sed -n 's/^Authority=/authority: /p'
          echo "--- embedded profile ---"
          if [ -f "$APP/embedded.mobileprovision" ]; then
            security cms -D -i "$APP/embedded.mobileprovision" | plutil -extract Name raw -o - -
            security cms -D -i "$APP/embedded.mobileprovision" | plutil -extract ExpirationDate raw -o - -
            security cms -D -i "$APP/embedded.mobileprovision" | plutil -extract Entitlements.application-identifier raw -o - -
          else
            echo "::error::embedded.mobileprovision is missing from the signed build."
            exit 1
          fi

      - name: Name the verified artifact
        if: success()
        run: cp build/artifacts/Swiftgram.ipa build/artifacts/AyuGram.ipa

      - name: Upload IPA
        if: success() && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-${{ github.run_number }}-${{ steps.signing.outputs.mode }}
          path: |
            build/artifacts/AyuGram.ipa
            build/artifacts/Swiftgram.DSYMs.zip
            build/artifacts/build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            build/logs/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f build-system/rufatgram-configuration.local.json
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/profiles.json"
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db"
          fi

      - name: Report failure details
        if: failure()
        run: |
          echo "::error::Build failed. Inspect the 'Build the app' step above; Bazel writes the real error before this banner."
          echo "Common causes: Xcode version mismatch (versions.json vs runner image), missing submodule, disk space, or a signing profile whose application-identifier does not start with <TEAM_ID>.<BUNDLE_ID>."
